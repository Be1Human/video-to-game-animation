name: Numerical tools
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/make_demo.py --output-dir demo-output
      - run: python scripts/analyze_motion.py demo-output/smooth-sliding.json --output demo-output/report.json
